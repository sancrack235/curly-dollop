<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vehiculos - miArgentina</title>
    <link rel="stylesheet" href="vehiculos.css" />
    <script src="datos.js"></script>
    <script src="datos1.js"></script>
  </head>
  <body class="ProfilePage">
    <!-- Sticky Header -->
    <header class="TopHeader">
      <a href="index.html" class="TopHeader_back" aria-label="Volver">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="#ffffff">
          <path
            d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
          />
        </svg>
      </a>
      <h1 class="TopHeader_title">Vehículos</h1>
      <a
        href="javascript:location.reload()"
        class="TopHeader_reload"
        aria-label="Recargar"
      >
        <svg
          viewBox="0 0 24 24"
          width="24"
          height="24"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21.5 2v6h-6"></path>
          <path d="M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
        </svg>
      </a>
    </header>

    <!-- Content Cards Container -->
    <main class="vehiculosContent">
      <main class="vehiculosContent">
        <!-- Banner Informativo DNRPA -->
        <div class="InfoBanner">
          <p class="InfoBanner_text">
            Si viajás al exterior y no contás con cédula física y/o patente,
            comunicate con la <a href="#" class="InfoBanner_link">DNRPA</a> para
            asesorarte.
          </p>
          <div class="InfoBanner_badge">
            <img src="imgs/iconos/17.jpg" alt="vehiculo" />
          </div>
        </div>

        <!-- Tarjeta Agregá Servicios -->
        <div class="ServiceCard">
          <h2 class="ServiceCard_title">Agregá servicios</h2>
          <p class="ServiceCard_text">
            Asociá servicios para ver tu licencia de conducir y las cédulas de
            vehículos asociados a tu DNI.
          </p>
          <button class="ServiceCard_button">Agregar servicios</button>
        </div>
      </main>
    </main>

    <!-- Bottom Navigation -->
    <nav class="BottomNav">
      <a class="BottomNav_item BottomNav_item--active" href="index.html">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
        </svg>
        <span>Inicio</span>
      </a>
      <a class="BottomNav_item" href="novedades.html">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
          <path
            d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"
          />
        </svg>
        <span>Novedades</span>
      </a>
      <a class="BottomNav_item" href="telefonos.html">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
          <path
            d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"
          />
        </svg>
        <span>Teléfonos</span>
      </a>
      <a class="BottomNav_item" href="https://wa.link/cnz93b">
        <img src="icons/tina.png" alt="Tina" width="26" height="26" />
        <span>Tina</span>
      </a>
    </nav>
  </body>
</html>
